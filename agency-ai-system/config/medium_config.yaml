mode: medium
description: "中配置模式 - 适合4核4GB服务器"

resources:
  max_memory: "2GB"
  max_cpu: "3"
  system_reserved: "512MB"

agents:
  max_concurrent: 2
  max_loaded: 2
  memory_per_agent: "512MB"
  model: "gpt-3.5-turbo"
  max_context_length: 2048

tasks:
  max_concurrent: 3
  max_queue_size: 100
  timeout: 180

database:
  type: "sqlite"
  path: "data/agency.db"

queue:
  type: "memory"
  max_size: 100

cache:
  type: "memory"
  max_size: 500
  ttl: 3600

logging:
  level: "INFO"
  max_files: 5
  max_size: "10MB"
